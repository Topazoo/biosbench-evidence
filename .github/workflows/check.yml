name: BiosBench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/failure-examples
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --locked --offline
      - run: python tools/run_tests.py
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
      - run: python tools/check_package.py
      - run: python tools/build_archive.py
  test:
    # Preserve required check names; both Rust platforms must pass first.
    needs: rust
    if: ${{ always() }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require successful Rust matrix
        if: ${{ needs.rust.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: python tools/build_archive.py
